# Zé Treino na VPS (Oracle Always Free) — stack completa puxando imagens do GHCR.
# Subir com:  docker compose up -d   (na pasta que contém este arquivo e o .env)
name: zetreino

services:
  # Mídia dos exercícios (~140 MB, baixada uma vez)
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "Baixando mídia dos exercícios (~140 MB, uma única vez)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "Mídia pronta ($$(ls /out/img | wc -l) imagens)."
        else
          echo "Mídia já presente."
        fi
    restart: "no"

  # API: passkeys + dados (Postgres via DATABASE_URL no .env)
  api:
    image: ghcr.io/belchiorjuniorr2/zetreino-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
      - DATA_DIR=/data
    volumes:
      - ./data:/data

  # Frontend compilado + proxy /api
  web:
    image: ghcr.io/belchiorjuniorr2/zetreino-web:latest
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro

  # Borda TLS: certificados automáticos (Let's Encrypt) para RP_ID/ORIGIN
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
